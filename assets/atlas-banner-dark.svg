<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="ATLAS — Autonomous Task, Learning and Agent System">
  <title>ATLAS — Autonomous Task, Learning and Agent System</title>

  <!-- Palette: design-system/tokens/colors.ts (warm editorial, single ochre accent).
       ground paper.950 · ink paper.50 · muted paper.400 · subtle paper.500 · accent accent.300
       All text pairs verified against WCAG AA at their rendered sizes. -->

  <rect width="1200" height="340" fill="#0F0D0A"/>

  <!-- Plate border + compartment divider: printed-plate convention, hairline only -->
  <rect x="20" y="20" width="1160" height="300" fill="none" stroke="#2E2820" stroke-width="1"/>
  <line x1="856" y1="20" x2="856" y2="320" stroke="#2E2820" stroke-width="1"/>

  <!-- ── Title block ─────────────────────────────────────────────── -->

  <text x="72" y="96" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="15" letter-spacing="4.5" fill="#B7A78D">AUTONOMOUS TASK · LEARNING · AGENT SYSTEM</text>

  <text x="68" y="190" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="96" letter-spacing="16" fill="#FBF8F3">ATLAS</text>

  <rect x="72" y="214" width="104" height="3" fill="#DDB562"/>

  <text x="72" y="254" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="20" fill="#B7A78D">A self-evolving operating system for Claude Code</text>

  <text x="72" y="296" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="13.5" letter-spacing="2.2" fill="#8F7F67">45 SKILLS · 21 AGENTS · 28 HOOKS · 29 COMMANDS · 4 CAPABILITY SYSTEMS</text>

  <!-- ── Armillary diagram ───────────────────────────────────────── -->

  <g transform="translate(1018,170)">
    <!-- graduation ring: dash pattern on r=81 gives 24 evenly spaced ticks -->
    <circle r="81" fill="none" stroke="#6B5E4B" stroke-width="6"
            stroke-dasharray="2 19.2" stroke-dashoffset="1"/>

    <circle r="74" fill="none" stroke="#8F7F67" stroke-width="1.25"/>

    <!-- rings of the sphere, sharing one axial tilt -->
    <g transform="rotate(-18)">
      <ellipse rx="74" ry="25" fill="none" stroke="#B7A78D" stroke-width="1.25"/>
      <ellipse rx="74" ry="52" fill="none" stroke="#6B5E4B" stroke-width="1.25"/>
      <ellipse rx="26" ry="74" fill="none" stroke="#6B5E4B" stroke-width="1.25"/>
      <!-- meridian, and a body tracking it -->
      <line x1="0" y1="-74" x2="0" y2="74" stroke="#8F7F67" stroke-width="1.25"/>
      <circle cx="70.4" cy="-7.7" r="4.5" fill="#DDB562"/>
    </g>

    <circle r="5.5" fill="#DDB562"/>

    <!-- fixed stars -->
    <circle cx="-96" cy="-58" r="1.6" fill="#8F7F67"/>
    <circle cx="101" cy="-72" r="1.3" fill="#6B5E4B"/>
    <circle cx="-108" cy="42" r="1.3" fill="#6B5E4B"/>
    <circle cx="94" cy="66" r="1.6" fill="#8F7F67"/>
  </g>

  <text x="1018" y="300" text-anchor="middle"
        font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="13.5" letter-spacing="3" fill="#8F7F67">VERSION 10.3.1</text>
</svg>
